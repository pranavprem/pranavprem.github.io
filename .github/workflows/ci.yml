name: Validate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    name: Format, HTML, and asset links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
